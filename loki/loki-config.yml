auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: debug

ingester:
  wal:
    enabled: true
    dir: /mnt/storage/loki/wal
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 1h
  max_chunk_age: 2h
  chunk_target_size: 1048576
  chunk_retain_period: 30s

common:
  path_prefix: /mnt/storage/loki
  storage:
    filesystem:
      chunks_directory: /mnt/storage/loki/chunks
      rules_directory: /mnt/storage/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /mnt/storage/loki/index
    cache_location: /mnt/storage/loki/boltdb-cache
  filesystem:
    directory: /mnt/storage/loki/chunks

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 500

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h

compactor:
  working_directory: /mnt/storage/loki/boltdb-shipper-compactor
  shared_store: filesystem
  retention_enabled: true